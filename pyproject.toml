[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bafras-web"
version = "2.0.0.dev0"
description = "Generador estático de la web corporativa de BAFRAS Engineering (V2): YAML + Pydantic v2 + Jinja2."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12,<3",
    "PyYAML>=6.0.2,<7",
    "Jinja2>=3.1.6,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
]

[project.scripts]
bafras-web = "bafras_web.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bafras_web = ["templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-p", "no:cacheprovider"]
