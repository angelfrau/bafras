  title: Erfahrung mit technischen Anlagen, Energie und Steuerungssystemen.
  eyebrow: PROJEKTE UND ERFAHRUNG
  paragraphs:
  - id: description
    text: Wir stellen Referenzen aus dem beruflichen Werdegang des Teams in den Bereichen Gebäude,
      Energieinfrastruktur und Automatisierungssysteme zusammen. Jedes Projekt bringt andere
      Herausforderungen mit sich; deshalb legen wir den Schwerpunkt auf den technischen Kontext, die
      erbrachten Leistungen und die konkrete Beteiligung unserer Fachleute.
