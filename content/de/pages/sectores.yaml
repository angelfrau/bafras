- id: sec-03
  source_block: SEC-03
  kind: text
  title: Ihr Anliegen passt in keine Kategorie?
  paragraphs:
  - id: description
    text: Eine Anlage, die nicht die erwartete Leistung bringt, eine zu bewertende Energieinvestition
      oder mehrere Geräte, die keine Daten austauschen, können in ganz unterschiedlichen
      Tätigkeitsfeldern auftreten. Wir gehen vom technischen Problem aus und legen fest, welche
      Fachbereiche erforderlich sind.
  actions:
  - id: capabilities
    label: Unsere Kompetenzen ansehen
    target:
      kind: internal
      page_id: capacidades
- id: sec-04
  source_block: SEC-04
  kind: text
  title: Ingenieurleistungen auch für Projektteams.
  paragraphs:
  - id: description
    text: Wir arbeiten mit Bauherren und Projektentwicklern, Facility-Managern, Architektur- und
      Ingenieurbüros, Bauunternehmen und Installationsbetrieben bei konkreten Studien-, Planungs-,
      Diagnose- und Begleitungsleistungen zusammen. Für jede Zusammenarbeit vereinbaren wir
      Arbeitsergebnisse, Koordination und Zuständigkeiten.
  actions:
  - id: about
    label: BAFRAS kennenlernen
    target:
      kind: internal
      page_id: sobre_bafras
- id: sec-05
  source_block: SEC-05
  kind: text
  title: Schildern Sie uns, was Sie lösen möchten.
  paragraphs:
  - id: description
    text: Nennen Sie uns die Art der Tätigkeit oder Anlage, den Projektstand und die Entscheidung oder
      das Problem, das Sie angehen möchten. Wir prüfen, welche Informationen wir benötigen, um den
      nächsten Schritt festzulegen.
  actions:
  - id: contact
    label: Schildern Sie uns Ihr Projekt
