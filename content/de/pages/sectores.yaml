  title: Wir verstehen das Umfeld, bevor wir die Maßnahme festlegen.
  introduction:
  - id: introduction
    text: Dies sind einige der Bereiche, in denen wir Ingenieurleistungen einbringen können. Die
      Beispiele beschreiben Anforderungen, die wir untersuchen können; es handelt sich nicht um
      Referenzen ausgeführter Projekte.
