- id: edge-ai-investigacion
  kind: founder_previous
  title: Angewandte Forschung zu KI und Edge AI
  person_refs: [murti]
  attribution: Murti Bär
  role: Forschung zu Energieprognosen und zur Optimierung neuronaler Netze
  summary:
  - id: summary
    text: Forschung zu Energieprognosen, zur Optimierung neuronaler Netze und zur effizienten Ausführung auf
      IoT-Hardware.
  context:
  - id: abstract
    text: Forschung zum Pruning mehrschichtiger neuronaler Netze mithilfe morphologischer Hilfsnetze, die über
      Pruning-Masken redundante Verbindungen entfernen. Validierung mit MNIST und Fashion-MNIST, Bewertung auf
      IoT-Hardware und Entwicklung von Softwarewerkzeugen zur Verbesserung der Inferenz auf Edge-Geräten.
  deliverables:
  - id: publication
    text: 'Pruning Dense Neural Networks for Efficient Edge Deployment in Internet of Things Applications. Elsevier,
      Applied Soft Computing, 23/05/2025.'
  results:
  - id: efficiency
    text: Die Ergebnisse zeigen Verbesserungen bei Energieeffizienz und Verarbeitungsgeschwindigkeit bei
      gleichzeitig konkurrenzfähiger Vorhersageleistung.
