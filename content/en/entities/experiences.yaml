- id: edge-ai-investigacion
  kind: founder_previous
  title: Applied research in AI and Edge AI
  person_refs: [murti]
  attribution: Murti Bär
  role: Researcher in energy forecasting and neural network optimisation
  summary:
  - id: summary
    text: Research in energy forecasting, neural network optimisation and efficient execution on IoT hardware.
  context:
  - id: abstract
    text: Research on pruning multilayer neural networks using auxiliary morphological neural networks, with
      pruning masks that remove redundant connections. Validation on MNIST and Fashion-MNIST, evaluation on IoT
      hardware and development of software tools to improve inference on edge devices.
  deliverables:
  - id: publication
    text: 'Pruning Dense Neural Networks for Efficient Edge Deployment in Internet of Things Applications. Elsevier,
      Applied Soft Computing, 23/05/2025.'
  results:
