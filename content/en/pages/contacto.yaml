sections:
- id: co-01
  source_block: CO-01
  kind: hero
  title: Let's talk about your project.
  eyebrow: CONTACT
  paragraphs:
  - id: description
    text: Briefly explain what you need to resolve, whether you are still defining the work or already
      have drawings, data or technical documentation. We will review your enquiry to assess whether we
      can help and what information it would be useful to analyse next.
- id: co-02
  source_block: CO-02
  kind: form
  title: Send us your enquiry.
  fields:
  - id: name
    label: Name *
    required: true
  - id: company
    label: Company or organisation
    required: false
  - id: email
    label: Email *
    required: true
  - id: message
    label: Tell us what you need *
    required: true
    help: You can include the type of installation or activity, the problem or planned work, the
      location and the project stage. You do not need to have all the details.
  submit_label: Send enquiry.
  messages:
    success: Your enquiry has been sent successfully.
    error: We could not send your enquiry. Please email us at info@bafras.com.
- id: co-03
  source_block: CO-03
  kind: text
  title: Prefer to write to us directly?
  paragraphs:
  - id: description
    text: You can contact us by email and describe the project in as much detail as you have available.
  contact_channels:
  - id: email
    label: Email
    value: info@bafras.com
    target:
      kind: contact
      channel: email
  - id: phone
    label: Phone
    value: +34 610 903 179
    target:
      kind: contact
      channel: phone
- id: co-04
  source_block: CO-04
  kind: text
  title: You don't need to have everything defined.
  paragraphs:
  - id: description
    text: An initial description may be enough to identify the right specialism and determine what
      information should be reviewed before defining a scope.
