- id: edge-ai-investigacion
  kind: founder_previous
  title: Investigación aplicada en IA y Edge AI
  person_refs: [murti]
  attribution: Murti Bär
  role: Investigador en predicción energética y optimización de redes neuronales
  summary:
  - id: summary
    text: Investigación en predicción energética, optimización de redes neuronales y ejecución eficiente sobre
      hardware IoT.
  context:
  - id: abstract
    text: Investigación sobre poda de redes neuronales multicapa mediante redes neuronales morfológicas
      auxiliares, utilizando máscaras de poda para eliminar conexiones redundantes. Validación mediante MNIST y
      Fashion-MNIST, evaluación sobre hardware IoT y desarrollo de herramientas de software para mejorar la
      inferencia en dispositivos edge.
  deliverables:
  - id: publication
    text: 'Pruning Dense Neural Networks for Efficient Edge Deployment in Internet of Things Applications. Elsevier,
      Applied Soft Computing, 23/05/2025.'
  results:
  - id: efficiency
    text: Los resultados muestran mejoras de eficiencia energética y velocidad de procesamiento, manteniendo un
      rendimiento predictivo competitivo.
    evidence_refs: ['https://doi.org/10.1016/j.asoc.2025.114175']
