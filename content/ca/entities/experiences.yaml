      avaluació sobre maquinari IoT i desenvolupament d'eines de programari per millorar la inferència en
      dispositius edge.
  deliverables:
  - id: publication
    text: 'Pruning Dense Neural Networks for Efficient Edge Deployment in Internet of Things Applications. Elsevier,
      Applied Soft Computing, 23/05/2025.'
  results:
