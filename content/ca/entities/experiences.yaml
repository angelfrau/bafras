  role: Investigador en predicció energètica i optimització de xarxes neuronals
  summary:
  - id: summary
    text: Recerca en predicció energètica, optimització de xarxes neuronals i execució eficient sobre maquinari
      IoT.
  context:
  - id: abstract
    text: Recerca sobre la poda de xarxes neuronals multicapa mitjançant xarxes neuronals morfològiques
