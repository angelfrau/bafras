<a class="skip-link" href="#contenido">{{ layout.messages["skip-link"] }}</a>
<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" href="{{ layout.home_url }}"><img class="brand__logo" src="{{ layout.logo_url }}" alt="{{ layout.brand }}" width="1270" height="273"></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" hidden>{{ layout.messages["menu"] }}</button>
    <nav class="site-nav" id="site-nav" aria-label="{{ layout.messages['main-navigation'] }}">
      <ul class="site-nav__list">
{% for item in layout.navigation %}
        <li><a href="{{ item.url }}"{% if item.current %} aria-current="page"{% endif %}>{{ item.label }}</a></li>
{% endfor %}
        <li><a class="site-nav__cta" href="{{ layout.cta.url }}"{% if layout.cta.current %} aria-current="page"{% endif %}>{{ layout.cta.label }}</a></li>
      </ul>
{% if layout.locales %}
      <ul class="site-nav__locales" aria-label="{{ layout.messages['language'] }}">
{% for item in layout.locales %}
        <li><a href="{{ item.url }}" lang="{{ item.code }}"{% if item.current %} aria-current="true"{% endif %}>{{ item.code }}</a></li>
{% endfor %}
      </ul>
{% endif %}
    </nav>
  </div>
</header>
