<footer class="site-footer">
  <div class="container site-footer__inner">
    <div class="site-footer__contact">
      <p class="site-footer__brand"><img class="site-footer__logo" src="{{ layout.logo_url }}" alt="{{ layout.brand }}" width="1270" height="273" loading="lazy"></p>
      <p><a href="{{ layout.email_href }}">{{ layout.email }}</a></p>
      <p><a href="{{ layout.phone_href }}">{{ layout.phone }}</a></p>
    </div>
    <ul class="site-footer__nav">
{% for item in layout.navigation %}
      <li><a href="{{ item.url }}">{{ item.label }}</a></li>
{% endfor %}
      <li><a href="{{ layout.cta.url }}">{{ layout.cta.label }}</a></li>
    </ul>
  </div>
</footer>
